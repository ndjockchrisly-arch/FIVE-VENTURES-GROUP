<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 76" fill="none">
  <!-- Five Ascending Slanted Rounded Bars (Official Five Ventures Group Identity) -->
  <!-- 1st bar: Warm Orange #E8751A | 2nd-5th bars: Deep Forest Green #0F3D2E -->
  <g transform="translate(18, 5) skewX(-18)">
    <!-- Bar 1 (Leftmost, Shortest): Warm Orange #E8751A -->
    <rect x="0" y="28" width="9.5" height="34" rx="4.75" fill="#E8751A" />
    
    <!-- Bar 2: Deep Forest Green #0F3D2E -->
    <rect x="15" y="21" width="9.5" height="41" rx="4.75" fill="#0F3D2E" />
    
    <!-- Bar 3: Deep Forest Green #0F3D2E -->
    <rect x="30" y="14" width="9.5" height="48" rx="4.75" fill="#0F3D2E" />
    
    <!-- Bar 4: Deep Forest Green #0F3D2E -->
    <rect x="45" y="7" width="9.5" height="55" rx="4.75" fill="#0F3D2E" />
    
    <!-- Bar 5 (Rightmost, Tallest): Deep Forest Green #0F3D2E -->
    <rect x="60" y="0" width="9.5" height="62" rx="4.75" fill="#0F3D2E" />
  </g>

  <!-- Typography matching official letterhead -->
  <text x="112" y="38" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="800" font-size="20" letter-spacing="0.03em" fill="#0F3D2E">
    FIVE VENTURES GROUP
  </text>
  
  <!-- Official Subtitle / Slogan from company letterhead -->
  <text x="113" y="56" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="500" font-size="10.5" letter-spacing="0.01em" fill="#1b4d3b">
    Votre partenaire pour un avenir durable
  </text>
</svg>
